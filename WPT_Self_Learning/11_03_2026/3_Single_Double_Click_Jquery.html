<!DOCTYPE html>
<html>
<head>
    <title>Click Events</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<p>Click or Double Click me</p>

<script>
    $("p").click(function() {
        alert("Single Click");
    });

    $("p").dblclick(function() {
        alert("Double Click");
    });
</script>

</body>
</html>
