<!DOCTYPE html>
<html>
<head>
    <title>Hide Heading</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<h1>Heading 1</h1>
<h2>Heading 2</h2>

<p id="pos"></p>

<script>
    $("h1, h2").click(function() {
        $(this).hide();
    });

    $(document).mousemove(function(e) {
        $("#pos").text("X: " + e.pageX + " Y: " + e.pageY);
    });
</script>

</body>
</html>
